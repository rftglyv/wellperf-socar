[project]
name = "wellperf"
version = "0.1.0"
description = "Intelligent well performance analysis: virtual flow metering + pressure transient analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "streamlit>=1.67.0",
    "watchdog>=7.1.0",
]

[project.scripts]
wellperf = "wellperf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
